name: Reward Availability Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: reward-availability-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run monitor
        env:
          P2E_STORAGE_STATE_B64: ${{ secrets.P2E_STORAGE_STATE_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_AMOUNTS: ${{ secrets.TARGET_AMOUNTS }}
          FREE_STOCK_TOTAL: 25
          POLL_SECONDS: ${{ secrets.POLL_SECONDS }}
          P2E_URL: https://playtoearn.com/earn
        run: python monitor.py

      - name: Start next monitor run
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Dispatching next monitor run..."
          gh workflow run monitor.yml --ref "${GITHUB_REF_NAME}"
